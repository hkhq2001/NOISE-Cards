<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOISE | تحدي الكروت</title><link rel="stylesheet" href="style.css"><header><b>NOISE <small>| تحدي الكروت</small></b></header><main><section id="login"><h1>دخول المواجهة</h1><input id="code" placeholder="رمز الدخول"><button onclick="login('admin')">مشرف</button><button onclick="login('player')">لاعب</button><button onclick="login('watch')">مشاهد</button><p id="msg"></p></section><section id="admin" hidden><h2>إعداد المواجهة</h2><div class="teams"><fieldset><legend>الفريق الأول</legend><input id="t1" placeholder="اسم الفريق"><input id="a1" placeholder="اللاعب الأول"><input id="a2" placeholder="اللاعب الثاني"></fieldset><fieldset><legend>الفريق الثاني</legend><input id="t2" placeholder="اسم الفريق"><input id="b1" placeholder="اللاعب الأول"><input id="b2" placeholder="اللاعب الثاني"></fieldset></div><label>الجولات <input id="rounds" type="number" value="1"></label><label>أزواج الكروت <input id="pairs" type="number" value="8"></label><label>القنابل <input id="bombs" type="number" value="1"></label><label>البونص <input id="bonuses" type="number" value="2"></label><button onclick="config()">حفظ وتوليد الأكواد</button><button onclick="emit('start')">بدء اللعبة</button><button onclick="emit('next')">الجولة التالية / إنهاء</button><button onclick="emit('reset')">إعادة ضبط</button><div id="codes"></div><h3>حالة الدخول</h3><div id="presence">بانتظار حالة اللاعبين…</div></section><section id="game" hidden><div id="scores"></div><h3 id="turn"></h3><div id="board"></div><div id="log"></div></section></main><script src="https://noise-cards.onrender.com/socket.io/socket.io.js"></script><script src="app.js"></script></html>
