<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOISE | تحدي الكروت</title><link rel="stylesheet" href="style.css"><header><b>NOISE <small>| تحدي الكروت</small></b></header><main><section id="login"><h1>دخول المواجهة</h1><input id="code" placeholder="رمز الدخول"><button onclick="login('admin')">مشرف</button><button onclick="login('player')">لاعب</button><button onclick="login('watch')">مشاهد</button><p id="msg"></p></section><section id="admin" hidden><h2>إعداد المواجهة</h2><div class="teams"><fieldset><legend>الفريق الأول</legend><input id="t1" placeholder="اسم الفريق"><input id="a1" placeholder="اللاعب الأول"><input id="a2" placeholder="اللاعب الثاني"></fieldset><fieldset><legend>الفريق الثاني</legend><input id="t2" placeholder="اسم الفريق"><input id="b1" placeholder="اللاعب الأول"><input id="b2" placeholder="اللاعب الثاني"></fieldset></div><label>الجولات <input id="rounds" type="number" value="1"></label><label>عدد الكروت <select id="cards"><option value="10">10 كرت</option><option value="15">15 كرت</option><option value="20">20 كرت</option><option value="25">25 كرت</option><option value="30">30 كرت</option><option value="35">35 كرت</option><option value="40">40 كرت</option><option value="45">45 كرت</option><option value="50" selected>50 كرت</option><option value="55">55 كرت</option><option value="60">60 كرت</option><option value="65">65 كرت</option><option value="70">70 كرت</option><option value="75">75 كرت</option><option value="80">80 كرت</option><option value="85">85 كرت</option><option value="90">90 كرت</option><option value="95">95 كرت</option><option value="100">100 كرت</option></select></label><label>القنابل <input id="bombs" type="number" value="1"></label><label>البونص <input id="bonuses" type="number" value="2"></label><button onclick="config()">حفظ وتوليد الأكواد</button><button onclick="emit('start')">بدء اللعبة</button><button onclick="emit('next')">الجولة التالية / إنهاء</button><button onclick="emit('reset')">إعادة ضبط</button><div id="codes"></div><h3>حالة الدخول</h3><div id="presence">بانتظار حالة اللاعبين…</div></section><section id="game" hidden><div id="scores"></div><h3 id="turn"></h3><h3 id="board-title">طاولة اللعب</h3><p id="admin-view-note" hidden>وضع المشرف: مشاهدة مباشرة للكروت وحركة اللاعبين — النقاط المعروضة هي نقاط كل فريق.</p><div id="board"></div><div id="log"></div></section></main><script src="https://noise-cards.onrender.com/socket.io/socket.io.js"></script><script src="app.js"></script></html>
